# Banc : effet d'une rule/skill de documentation sur le projet freedy.
# Prompt volontairement neutre (documenter, rien de plus) : c'est la config
# (rule/skill + templates) qui doit apporter la méthode et l'exigence, pas la
# consigne. Les critères de qualité vivent dans evaluate.rubric ; les checks
# sont des garde-fous déterministes qui montent à l'échelle avec le projet.
prompt: Documente ce projet Go.
app: ../../../freedy
model: sonnet
runs: 1
concurrency: 3
sandbox:
  image: claude-benchy-go:latest
output: ./results
# Garde le CLAUDE.md de freedy comme base et superpose celui de chaque config
# par-dessus, au lieu de le remplacer : on compare « base + surcouche ».
keepBaseConfig: true
evaluate:
  rubric:
    - "Rend autonome tout lecteur quel que soit son profil (dev, PO, expert métier, nouvel arrivant, non-initié) : index d'entrée par public, fonctionnel sans jargon, architecture pour dev"
    - "Permet de reconstruire le projet à l'identique : user stories + critères d'acceptation (Gherkin), cas de test, cas limites et non triviaux, invariants, commandes de build et configuration"
    - "Fournit les artefacts clés : matrice de traçabilité (feature → US → tests → code) citant de vrais tests, ADR pour les décisions non triviales, diagrammes Mermaid pour les flux"
    - "Découpe pertinente et scalable : une page par unité (package / fonctionnalité), un index de navigation par dossier, aucune redite (information à une seule source, reliée par liens)"
    - "Fidèle au code, sans invention ni doc de code mort ; ne modifie ni le code, ni les tests, ni la configuration"
    - "Rédigée en français, en Markdown, pages reliées, gabarits entièrement remplis (aucun placeholder résiduel)"
  # Garde-fous déterministes exécutés dans le sandbox (image golang bookworm :
  # go, grep GNU, find, sort disponibles). Passe si exit 0.
  # Chaque check tient sur UNE ligne : le formulaire du dashboard aplatit les
  # scalaires multilignes (les sauts de ligne seraient perdus), ce qui casserait
  # un script `run: |`. On enchaîne donc par `;` / `&&`.
  checks:
    - name: "backbone de doc présent"
      run: "test -f docs/index.md && test -f docs/architecture/index.md && test -f docs/fonctionnel/index.md && test -f docs/domaine/glossaire.md && test -f docs/domaine/regles-metier.md && test -f docs/traceabilite.md && test -d docs/architecture/decisions"
    - name: "une page d'architecture par package internal"
      run: "rc=0; for d in $(find internal -type d); do ls \"$d\"/*.go >/dev/null 2>&1 && { [ -f \"docs/architecture/$d.md\" ] || { echo \"manque docs/architecture/$d.md\"; rc=1; }; }; done; exit $rc"
    - name: "matrice ancrée dans de vrais tests"
      run: "tests=$(find . -name '*_test.go' -exec grep -hoE 'Test[A-Za-z0-9_]+' {} + | sort -u); [ -z \"$tests\" ] && exit 0; for t in $tests; do grep -rq \"$t\" docs && exit 0; done; echo 'aucun test réel cité'; exit 1"
    - name: "aucun placeholder résiduel dans docs"
      run: "! grep -rq 'TODO' docs"
    - name: "code non modifié (compile, natif)"
      run: "go vet ./internal/..."
configs:
  - name: vanilla
    bundle: ./configs/vanilla
  - name: skill-and-rule
    bundle: ./configs/skill-and-rule
