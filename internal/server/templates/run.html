<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>benchy · run #{{.ID}}</title>
  <script>{{themeInitJS}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="logo">b</span><span class="name">benchy</span></a>
  <span class="root">run #{{.ID}}</span>
  <span class="spacer"></span>
  <nav class="nav-seg" aria-label="Sections">
    <a class="seg" href="/">Dashboard</a>
    <span class="seg active" aria-current="page">Run live</span>
    <a class="seg" href="/report?dir={{.ReportDir}}">Rapport</a>
  </nav>
  <button type="button" id="theme-toggle" class="theme-toggle" title="Basculer le thème">☀</button>
</header>

<main class="page">
  <div class="run-head">
    <h1>Run #{{.ID}}</h1>
    <span id="status" role="status" class="badge {{.Status}}">{{if eq .Status "running"}}<span class="pip"></span>{{end}}{{.Status}}</span>
    <span class="spacer"></span>
    <form id="stop-form" method="post" action="/runs/{{.ID}}/stop">
      <button type="submit" class="danger">■ Arrêter</button>
    </form>
  </div>
  <p class="run-sub">progression en direct · orchestration &amp; agents</p>

  <div class="terminal">
    <div class="terminal-head">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">orchestration</span>
    </div>
    <pre id="log" class="console" aria-live="polite"></pre>
    <div class="term-cursor" id="log-cursor">▍<span class="blink">_</span></div>
  </div>
  <noscript>
    <p class="muted">JavaScript désactivé — progression non diffusée. Rechargez la page.</p>
    <div class="terminal"><pre class="console">{{range .Logs}}{{.}}
{{end}}</pre></div>
  </noscript>

  <div class="actions">
    <a id="report-link" class="button primary" href="/report?dir={{.ReportDir}}" hidden>Voir le rapport →</a>
    <a class="button" href="/">← Retour</a>
  </div>

  <section id="agents-panel" hidden>
    <div class="agents-head">
      <h2>Agents · sortie en direct</h2>
      <span class="note">config × run</span>
    </div>
    <div id="agents" class="agents"></div>
  </section>
</main>

<script src="/static/theme.js"></script>
<script>
  var id = {{.ID}};
  var reportDir = {{.ReportDir}};
  var log = document.getElementById('log');
  var status = document.getElementById('status');
  var agentsPanel = document.getElementById('agents-panel');
  var agentsBox = document.getElementById('agents');
  var agents = {};

  function macDots() {
    var wrap = document.createElement('span');
    wrap.style.display = 'inline-flex';
    wrap.style.gap = '5px';
    ['r', 'y', 'g'].forEach(function (c) {
      var d = document.createElement('span');
      d.className = 'dot ' + c;
      wrap.appendChild(d);
    });
    return wrap;
  }

  function agentPanel(key) {
    if (agents[key]) { return agents[key]; }
    agentsPanel.hidden = false;
    var wrap = document.createElement('div');
    wrap.className = 'agent';
    var head = document.createElement('div');
    head.className = 'agent-head';
    var name = document.createElement('span');
    name.className = 'agent-name';
    name.textContent = key;
    var badge = document.createElement('span');
    badge.className = 'badge running';
    badge.textContent = 'running';
    var link = document.createElement('a');
    link.className = 'agent-link';
    link.target = '_blank';
    link.href = '/transcript?dir=' + encodeURIComponent(reportDir + '/' + key);
    link.textContent = 'transcript ↗';
    head.appendChild(macDots());
    head.appendChild(name);
    head.appendChild(badge);
    head.appendChild(link);
    var pre = document.createElement('pre');
    pre.className = 'console agent-log';
    var cursor = document.createElement('div');
    cursor.className = 'term-cursor';
    cursor.innerHTML = '▍<span class="blink">_</span>';
    wrap.appendChild(head);
    wrap.appendChild(pre);
    wrap.appendChild(cursor);
    agentsBox.appendChild(wrap);
    agents[key] = { pre: pre, badge: badge, cursor: cursor };
    return agents[key];
  }

  var es = new EventSource('/runs/' + id + '/events');

  es.addEventListener('log', function (e) {
    log.textContent += e.data + '\n';
    log.scrollTop = log.scrollHeight;
  });

  es.addEventListener('agent', function (e) {
    var ev = JSON.parse(e.data);
    var p = agentPanel(ev.agent);
    if (ev.line) {
      p.pre.textContent += ev.line + '\n';
      p.pre.scrollTop = p.pre.scrollHeight;
    }
    if (ev.status) {
      p.badge.textContent = ev.status;
      p.badge.className = 'badge ' + ev.status;
      p.cursor.hidden = true;
    }
  });

  es.addEventListener('done', function (e) {
    es.close();
    var state = e.data.split(':')[0];
    status.textContent = e.data;
    status.className = 'badge ' + state;
    var cursor = document.getElementById('log-cursor');
    if (cursor) { cursor.hidden = true; }
    var stop = document.getElementById('stop-form');
    if (stop) { stop.hidden = true; }
    document.getElementById('report-link').hidden = false;
  });
</script>
</body>
</html>
