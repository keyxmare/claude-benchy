<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>benchy · run #{{.ID}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <span class="brand"><a href="/">benchy</a></span>
  <span class="root">run #{{.ID}}</span>
</header>

<main class="layout single">
  <section class="panel">
    <div class="run-head">
      <h1>Run #{{.ID}}</h1>
      <span id="status" class="badge {{.Status}}">{{.Status}}</span>
      <form id="stop-form" method="post" action="/runs/{{.ID}}/stop">
        <button type="submit" class="danger">Arrêter</button>
      </form>
    </div>

    <pre id="log" class="console" aria-live="polite"></pre>
    <noscript>
      <p class="muted">JavaScript désactivé — progression non diffusée. Rechargez la page.</p>
      <pre class="console">{{range .Logs}}{{.}}
{{end}}</pre>
    </noscript>

    <p><a id="report-link" class="primary button" href="/report?dir={{.ReportDir}}" hidden>Voir le rapport</a>
       <a class="button" href="/">← Retour</a></p>
  </section>

  <section class="panel" id="agents-panel" hidden>
    <h2 class="panel-sub">Agents · sortie en direct</h2>
    <div id="agents" class="agents"></div>
  </section>
</main>

<script>
  var id = {{.ID}};
  var reportDir = {{.ReportDir}};
  var log = document.getElementById('log');
  var status = document.getElementById('status');
  var agentsPanel = document.getElementById('agents-panel');
  var agentsBox = document.getElementById('agents');
  var agents = {};

  function agentPanel(key) {
    if (agents[key]) { return agents[key]; }
    agentsPanel.hidden = false;
    var wrap = document.createElement('div');
    wrap.className = 'agent';
    var head = document.createElement('div');
    head.className = 'agent-head';
    var name = document.createElement('span');
    name.className = 'agent-name';
    name.textContent = key;
    var badge = document.createElement('span');
    badge.className = 'badge running';
    badge.textContent = 'running';
    var link = document.createElement('a');
    link.className = 'agent-link';
    link.target = '_blank';
    link.href = '/transcript?dir=' + encodeURIComponent(reportDir + '/' + key);
    link.textContent = 'transcript ↗';
    head.appendChild(name);
    head.appendChild(badge);
    head.appendChild(link);
    var pre = document.createElement('pre');
    pre.className = 'console agent-log';
    wrap.appendChild(head);
    wrap.appendChild(pre);
    agentsBox.appendChild(wrap);
    agents[key] = { pre: pre, badge: badge };
    return agents[key];
  }

  var es = new EventSource('/runs/' + id + '/events');

  es.addEventListener('log', function (e) {
    log.textContent += e.data + '\n';
    log.scrollTop = log.scrollHeight;
  });

  es.addEventListener('agent', function (e) {
    var ev = JSON.parse(e.data);
    var p = agentPanel(ev.agent);
    if (ev.line) {
      p.pre.textContent += ev.line + '\n';
      p.pre.scrollTop = p.pre.scrollHeight;
    }
    if (ev.status) {
      p.badge.textContent = ev.status;
      p.badge.className = 'badge ' + ev.status;
    }
  });

  es.addEventListener('done', function (e) {
    es.close();
    var state = e.data.split(':')[0];
    status.textContent = e.data;
    status.className = 'badge ' + state;
    var stop = document.getElementById('stop-form');
    if (stop) { stop.hidden = true; }
    document.getElementById('report-link').hidden = false;
  });
</script>
</body>
</html>
