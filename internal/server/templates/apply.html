<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>benchy · {{.Title}}</title>
  <script>{{themeInitJS}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="logo">b</span><span class="name">benchy</span></a>
  <span class="root">appliquer</span>
  <span class="spacer"></span>
  <button type="button" id="theme-toggle" class="theme-toggle" title="Basculer le thème">☀</button>
</header>

<main class="page">
  <section class="panel">
    <div class="panel-body">
      <h1>{{.Title}}</h1>
      <p>{{.Message}}</p>
      <div class="actions"><a class="button" href="{{.Back}}">← Retour au rapport</a></div>
    </div>
  </section>
</main>

<script src="/static/theme.js"></script>
</body>
</html>
