<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>benchy · transcript {{.Agent}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <span class="brand"><a href="/">benchy</a></span>
  <span class="root">transcript · {{.Agent}}</span>
</header>

<main class="layout single">
  <section class="panel">
    <div class="run-head">
      <h1>Transcript</h1>
      <span class="badge done">{{.Agent}}</span>
    </div>
    {{if .Lines}}
    <pre class="console">{{range .Lines}}{{.}}
{{end}}</pre>
    {{else}}
    <p class="muted">Transcript vide ou illisible.</p>
    {{end}}
    <p><a class="button" href="javascript:history.back()">← Retour</a></p>
  </section>
</main>
</body>
</html>
