<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>benchy · transcript {{.Agent}}</title>
  <script>{{themeInitJS}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="logo">b</span><span class="name">benchy</span></a>
  <span class="root">transcript · {{.Agent}}</span>
  <span class="spacer"></span>
  <button type="button" id="theme-toggle" class="theme-toggle" title="Basculer le thème">☀</button>
</header>

<main class="page">
  <div class="run-head"><h1>Transcript</h1></div>
  <p class="run-sub">{{.Agent}}</p>
  {{if .Lines}}
  <div class="terminal">
    <div class="terminal-head">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">transcript</span>
    </div>
    <pre class="console">{{range .Lines}}{{.}}
{{end}}</pre>
  </div>
  {{else}}
  <p class="muted">Transcript vide ou illisible.</p>
  {{end}}
  <div class="actions"><button type="button" class="button" onclick="history.back()">← Retour</button></div>
</main>

<script src="/static/theme.js"></script>
</body>
</html>
