version: "2"

# Plancher mesurable des principes de conception (couche 1). Les principes de
# jugement (SRP, LSP, YAGNI, PoLA…) relèvent de la rule go-design.md et de
# standards-auditor, pas du linter. Seuils volontairement progressifs :
# ils passent sur l'existant et se resserreront ensuite.
linters:
  enable:
    - gocyclo        # KISS : complexité cyclomatique par fonction
    - gocognit       # KISS : complexité cognitive
    - funlen         # KISS / SRP : fonctions trop longues
    - nestif         # KISS : imbrication de if
    - dupl           # DRY : duplication mécanique (garde-fou, pas RoT)
    - interfacebloat  # ISP : interfaces trop larges
    - errorlint      # Fail Fast : comparaison/wrapping d'erreurs correct
    - unparam        # PoLP : paramètres et retours inutilisés
    - revive         # discipline générale, surface exportée
    - gocritic       # LoD / idiomes / diagnostics
    - unconvert      # Boy Scout : conversions superflues

  settings:
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 30
    funlen:
      lines: 100
      statements: 60
    nestif:
      min-complexity: 6
    dupl:
      threshold: 160
    interfacebloat:
      max: 10

  exclusions:
    generated: lax
    rules:
      # Les tests sont longs et répétitifs par nature (table-driven, AAA) ;
      # leurs helpers gardent des paramètres symétriques (unparam).
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - gocyclo
          - dupl
          - unparam
